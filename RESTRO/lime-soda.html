<section class="food-detail">

<div class="food-detail-box">

    <img src="images/lime-soda.jpg"
         alt="Fresh Lime Soda">

    <div class="food-info">

        <h2>Fresh Lime Soda</h2>

        <p>
            A refreshing lime drink made with fresh lime,
            chilled soda and your choice of sweetness.
        </p>

        <h3>Ingredients</h3>

        <p>
            Fresh lime, soda, sugar, mint and ice.
        </p>

        <form action="drink-order.php" method="POST">

            <input type="hidden"
                   name="drink"
                   value="Fresh Lime Soda">

            <label>Your Name</label>

            <input type="text"
                   name="name"
                   required>


            <label>Sweetness</label>

            <select name="sweetness">

                <option>Normal</option>
                <option>Less Sweet</option>
                <option>No Sugar</option>
                <option>Extra Sweet</option>

            </select>


            <label>Ice</label>

            <select name="ice">

                <option>Normal Ice</option>
                <option>Less Ice</option>
                <option>No Ice</option>

            </select>


            <label>Flavour</label>

            <select name="flavour">

                <option>Classic Lime</option>
                <option>Mint</option>
                <option>Ginger</option>

            </select>


            <label>Quantity</label>

            <input type="number"
                   name="quantity"
                   min="1"
                   value="1"
                   required>


            <button type="submit">
                Order Drink
            </button>

        </form>

    </div>

</div>


</section>
