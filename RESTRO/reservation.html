<section class="page reservation-page">

    <div class="content-box">

        <h2>Make a Reservation</h2>

        <p>
            Reserve a table at Restro and enjoy
            a comfortable dining experience.
        </p>

        <p>
            We also accept pre-bookings for birthdays,
            anniversaries, family gatherings and
            other special events.
        </p>


        <form action="reservation.php"
              method="POST">


            <input type="text"
                   name="name"
                   placeholder="Your Name"
                   required>


            <input type="tel"
                   name="phone"
                   placeholder="Phone Number"
                   required>


            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>


            <label>
                Reservation Date
            </label>

            <input type="date"
                   name="date"
                   required>


            <label>
                Reservation Time
            </label>

            <input type="time"
                   name="time"
                   required>


            <input type="number"
                   name="guests"
                   placeholder="Number of Guests"
                   min="1"
                   required>


            <label>
                Reservation Type
            </label>

            <select name="reservation_type"
                    required>

                <option value="">
                    Select Reservation Type
                </option>

                <option value="Regular Table">
                    Regular Table
                </option>

                <option value="Birthday Party">
                    Birthday Party
                </option>

                <option value="Anniversary">
                    Anniversary
                </option>

                <option value="Family Event">
                    Family Event
                </option>

                <option value="Other Event">
                    Other Event
                </option>

            </select>


            <textarea name="message"
                      placeholder="Special Request or Message">
            </textarea>


            <button type="submit">
                Make Reservation
            </button>

        </form>

    </div>

</section>

<script src="js/script.js"></script>
