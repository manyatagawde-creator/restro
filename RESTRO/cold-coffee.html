<section class="food-detail">


    <div class="food-detail-box">

        <img src="images/cold-coffee.jpg"
             alt="Cold Coffee">


        <div class="food-info">

            <h2>
                Cold Coffee
            </h2>


            <p>
                A chilled and creamy coffee prepared with
                milk and coffee, customized to your taste.
            </p>


            <h3>
                Ingredients
            </h3>


            <p>
                Milk, coffee, sugar, ice and optional toppings.
            </p>


            <form action="drink-order.php"
                  method="POST">


                <input type="hidden"
                       name="drink"
                       value="Cold Coffee">


                <label>
                    Your Name
                </label>

                <input type="text"
                       name="name"
                       required>


                <label>
                    Coffee Strength
                </label>

                <select name="strength">

                    <option>
                        Regular
                    </option>

                    <option>
                        Strong
                    </option>

                    <option>
                        Light
                    </option>

                </select>


                <label>
                    Sweetness
                </label>

                <select name="sweetness">

                    <option>
                        Normal
                    </option>

                    <option>
                        Less Sweet
                    </option>

                    <option>
                        Extra Sweet
                    </option>

                </select>


                <label>
                    Topping
                </label>

                <select name="topping">

                    <option>
                        No Topping
                    </option>

                    <option>
                        Chocolate
                    </option>

                    <option>
                        Caramel
                    </option>

                    <option>
                        Whipped Cream
                    </option>

                </select>


                <label>
                    Quantity
                </label>

                <input type="number"
                       name="quantity"
                       min="1"
                       value="1"
                       required>


                <button type="submit">
                    Order Drink
                </button>


            </form>

        </div>

    </div>

</section>


</body>

</html>
