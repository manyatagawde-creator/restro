      content="width=device-width, initial-scale=1.0">

</head>

<body>

<header>


<nav>

    <h1 class="logo">𝙍𝙀𝙎𝙏𝙍𝙊</h1>

    <ul>

        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>

        <li><a href="gallery.html">Gallery</a></li>

    </ul>

</nav>


</header>

<section class="food-detail">


<div class="food-detail-box">

    <img src="images/mint-mojito.jpg"
         alt="Mint Mojito">

    <div class="food-info">

        <h2>Mint Mojito</h2>

        <p>
            A cool and refreshing mint and lime drink
            prepared according to your taste.
        </p>

        <h3>Ingredients</h3>

        <p>
            Fresh mint, lime, sugar, soda and ice.
        </p>


        <form action="drink-order.php" method="POST">

            <input type="hidden"
                   name="drink"
                   value="Mint Mojito">


            <label>Your Name</label>

            <input type="text"
                   name="name"
                   required>


            <label>Sweetness</label>

            <select name="sweetness">

                <option>Normal</option>
                <option>Less Sweet</option>
                <option>Extra Sweet</option>

            </select>


            <label>Ice</label>

            <select name="ice">

                <option>Normal Ice</option>
                <option>Less Ice</option>
                <option>No Ice</option>

            </select>


            <label>Mint</label>

            <select name="mint">

                <option>Normal Mint</option>
                <option>Extra Mint</option>
                <option>Less Mint</option>

            </select>


            <label>Lime</label>

            <select name="lime">

                <option>Normal Lime</option>
                <option>Extra Lime</option>
                <option>Less Lime</option>

            </select>


            <label>Quantity</label>

            <input type="number"
                   name="quantity"
                   min="1"
                   value="1"
                   required>


            <button type="submit">
                Order Drink
            </button>

        </form>

    </div>

</div>


</section>

</body>
</html>
